<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1">

    <title>Syst&#xE8;me d&apos;arrosage</title>

    <script src="https://code.jquery.com/jquery-3.1.1.min.js"
        integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="js/jquery-1.5.0.mobile.min.css">

    <link rel="stylesheet" type="text/css" href="fomantic/semantic.min.css">
    <script src="fomantic/semantic.min.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        /* For avoiding title truncation in wp8 */
        .ui-header .ui-title {
            overflow: visible !important;
        }

        /* For fixing the absolute position issue for the default cordova gen page*/
        #cjp-accordion1 .app {
            left: 5px !important;
            margin: 5px !important;
            position: relative !important;
        }
    </style>

    <template id="test_output_template">
        <div class="column">
            <div class="ui test toggle checkbox">
                <input type="checkbox" name="test_output_${index}" id="test_output_${index}" data-value="${index}">
                <label>Sortie ${index}</label>
            </div>
        </div>
    </template>

    <template id="device_list_entry_template">
        <div class="item">
            <i class="large tint middle aligned icon"></i>
            <div class="content">
                <a class="header" id="device_list_name_${index}" href="#">${name}</a>
                <div class="description" id="device_list_id_${index}">${id}</div>
            </div>
        </div>
    </template>

</head>

<body>
    <div class="ui menu inverted">
        <div class="ui two column grid">
            <div class="four column row">
                <div class="left floated column">
                    <div class="row">
                        <h2>
                            Syst&#xE8;me d&apos;arrosage
                        </h2>
                        <div class="ui action input">
                            <button id="search_btn" class="ui button">Rechercher</button>
                        </div>
                    </div>
                </div>
                <div id="status_bar" class="right floated column">
                    <h3 id="status_text">
                    </h3>
                    <div class="ui inverted segment">
                        <div id="status_loader" class="ui active inverted centered inline loader">
                            <div class="ui large loader"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="device_list" class="ui relaxed divided list">
    </div>
    <div id="debug">
    </div>
    <div id="main_view" class="ui container">
        <div class="ui top attached tabular menu">
            <a class="item active" data-tab="automatic">Programmation</a>
            <a class="item" data-tab="manual">Test</a>
        </div>
        <div class="ui bottom attached tab segment active" data-tab="automatic">
            <div class="ui prog two column vertically divided grid">
                <div class="row">
                    <div id="output_select" class="column">
                        <select id="program_selection" class="ui search selection dropdown">
                            <option value="0">Sortie 1</option>
                            <option value="1">Sortie 2</option>
                            <option value="2">Sortie 3</option>
                            <option value="3">Sortie 4</option>
                            <option value="4">Sortie 5</option>
                            <option value="5">Sortie 6</option>
                            <option value="6">Sortie 7</option>
                            <option value="7">Sortie 8</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Programme actif</p>
                    </div>
                    <div class="ten wide column">
                        <div id="program_enabled" class="ui toggle checkbox">
                            <input id="program_enabled_input" type="checkbox" name="public">
                            <label></label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">D&#xE9;bit</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui right labeled input">
                            <input id="program_flow_speed" type="number" placeholder="100" min="0" max="100">
                            <div class="ui basic label">
                                %
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Date de d&#xE9;but</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui calendar" id="standard_calendar">
                            <div class="ui fluid input left icon">
                                <i class="calendar icon"></i>
                                <input type="text" placeholder="Date/Heure">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Dur&#xE9;e d&apos;arrosage</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui right labeled input">
                            <input id="program_duration" type="number" placeholder="0">
                            <select id="program_duration_time_type"
                                class="ui selection dropdown label time_length_input">
                                <option value="s">Secondes</option>
                                <option value="m">Minutes</option>
                                <option value="h">Heures</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">R&#xE9;p&#xE9;tition</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui right labeled input">
                            <input id="program_period" type="number" placeholder="0">
                            <select id="program_period_time_type" class="ui selection dropdown label time_length_input">
                                <option value="d" class="item">Jours</option>
                                <option value="h" class="item">Heures</option>
                                <option value="m" class="item">Minutes</option>
                                <option value="s" class="item">Secondes</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ui equal width grid">
                <div class="column">
                    <button id="test_btn" class="ui fullwidth button">Tester</button>
                    <button id="stop_btn" class="ui fullwidth button">Stop</button>
                </div>
                <div class="column">
                    <button id="apply_btn" class="ui fullwidth button">Appliquer</button>
                </div>
            </div>
        </div>
        <div class="ui bottom attached tab segment" data-tab="manual">
            <div id="test_output_container" class="ui two column grid" style="margin: 1rem 0 1rem 0;">
                <div class="column">
                    <p class="vertical-center">D&#xE9;bit</p>
                </div>
                <div class="column">
                    <div class="ui right labeled input">
                        <input id="test_flow_speed" type="number" placeholder="100" min="0" max="100">
                        <div class="ui basic label">
                            %
                        </div>
                    </div>
                </div>
            </div>
            <button id="pump_on_btn" class="ui fullwidth button">Activer la pompe</button>
            <button id="pump_off_btn" class="ui fullwidth button">D&#xE9;sactiver la pompe</button>
        </div>
    </div>

    <script type="text/javascript" src="cordova.js"></script>
    <!-- <script type="text/javascript" src="main.js"></script> -->
    <script type="text/javascript" src="lib.js"></script>
</body>

</html>
