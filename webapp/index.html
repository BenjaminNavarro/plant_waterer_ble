<!DOCTYPE html>
<html>

<head>
    <!-- Standard Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <!-- Site Properties -->
    <title>Responsive Elements - Semantic</title>
    <link rel="stylesheet" type="text/css" href="fomantic/semantic.min.css">
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"
        integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>
    <script src="fomantic/semantic.min.js"></script>

    <style type="text/css">
        body {
            background-color: #FFFFFF;
        }

        .ui.menu .item img.logo {
            margin-right: 1.5em;
        }

        .ui.menu.fixed {
            padding: 1em 0 1em 0;
        }

        .main.container {
            margin-top: 7em;
        }

        .wireframe {
            margin-top: 2em;
        }

        .ui.footer.segment {
            margin: 5em 0em 0em;
            padding: 5em 0em;
        }

        .vertical-center {
            margin: 0;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .prog.grid>.row {
            padding-top: 0;
            padding-bottom: 0;
        }
    </style>

    <script>
        function interpolate(template, params) {
            const replaceTags = {
                '&': '& amp;', '<': '& lt;', '>': '& gt;', '(': '% 28', ')': '% 29'
            };
            const safeInnerHTML = text => text.toString()
                .replace(/[&<>\(\)]/g, tag => replaceTags[tag] || tag);
            const keys = Object.keys(params);
            const keyVals = Object.values(params).map(safeInnerHTML);
            return new Function(...keys, `return \`${template}\``)(...keyVals);
        }
    </script>

    <template id="test_output_template">
        <div class="column">
            <div class="ui test toggle checkbox">
                <input type="checkbox" name="test_output_${index}">
                <label>Sortie ${index}</label>
            </div>
        </div>
    </template>

</head>

<body>
    <div class="ui menu inverted" style="padding: 1em;">
        <div class="ui two column grid" style="width: 100%;">
            <div class="four column row">
                <div class="left floated column">
                    <div class="row">
                        <h2 style="color: white;">
                            Système d'arrosage
                        </h2>
                        <div class="ui action input">
                            <input id="system_address_input" type="text" placeholder="Adresse du système"
                                value="esp-home.local" style="max-width: 40%;">
                            <button id="connect_button" class="ui button">Connexion</button>
                        </div>
                    </div>
                </div>
                <div id="status_bar" class="right floated column" style="display: none;">
                    <h3 id="status_text" style="color: white; text-align: center; vertical-align: baseline;">
                    </h3>
                    <div class="ui inverted segment">
                        <div id="status_loader" class="ui active inverted centered inline loader">
                            <div class="ui large loader"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="main_view" class="ui container">
        <div class="ui top attached tabular menu">
            <a class="item active" data-tab="programming">Programmation</a>
            <a class="item" data-tab="testing">Test</a>
        </div>
        <div class="ui bottom attached tab segment active" data-tab="programming">
            <div class="ui prog two column vertically divided grid">
                <div class="row" style="padding-top: 1rem;">
                    <div class="column">
                        <select class="ui search selection dropdown">
                            <option value="0">Sortie 1</option>
                            <option value="1">Sortie 2</option>
                            <option value="2">Sortie 3</option>
                            <option value="3">Sortie 4</option>
                            <option value="4">Sortie 5</option>
                            <option value="5">Sortie 6</option>
                            <option value="6">Sortie 7</option>
                            <option value="7">Sortie 8</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Programme actif</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui toggle checkbox">
                            <input type="checkbox" name="public">
                            <label></label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Date de début</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui calendar" id="standard_calendar">
                            <div class="ui fluid input left icon">
                                <i class="calendar icon"></i>
                                <input type="text" placeholder="Date/Heure">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Durée d'arrosage</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui right labeled input">
                            <input type="number" placeholder="0" style="max-width: 6rem;">
                            <div class="ui dropdown label">
                                <div class="text">Secondes</div>
                                <i class="dropdown icon"></i>
                                <div class="menu">
                                    <div class="item">Secondes</div>
                                    <div class="item">Minutes</div>
                                    <div class="item">Heures</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Répétition</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui right labeled input">
                            <input type="number" placeholder="0" style="max-width: 6rem;">
                            <div class="ui dropdown label">
                                <div class="text">Heures</div>
                                <i class="dropdown icon"></i>
                                <div class="menu">
                                    <div class="item">Minutes</div>
                                    <div class="item">Heures</div>
                                    <div class="item">Jours</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ui equal width grid">
                <div class="column">
                    <button id="test_btn" class="ui button" style="width: 100%;">Tester</button>
                    <button id="stop_btn" class="ui button" style="width: 100%; display: none;">Stop</button>
                </div>
                <div class="column">
                    <button id="apply_btn" class="ui button" style="width: 100%;">Appliquer</button>
                </div>
            </div>
        </div>
        <div class="ui bottom attached tab segment" data-tab="testing">
            <div id="test_output_container" class="ui two column grid" style="margin: 1rem 0 2rem 0;"></div>
            <button id="pump_on_btn" class="ui button" style="width: 100%;">Activer la pompe</button>
            <button id="pump_off_btn" class="ui button" style="width: 100%; display: none;">Désactiver la pompe</button>
        </div>
    </div>


    <script>
        $(document).ready(function () {
            $('#standard_calendar').calendar({
                firstDayOfWeek: 1
            });

            $('.ui.dropdown').dropdown();

            $('.menu .item').tab();

            var main_view = $('#main_view');
            main_view.css('display', 'none');

            var loader_timer = null

            $("#connect_button").click(function () {
                // const address = $("#system_address_input").val();
                // const url = "http://" + address + "/api/v1/schedule/read";
                // $.getJSON(url, data => {
                //     console.log(data);
                // });
                $("#status_text").html("Connexion");
                $("#status_bar").css('display', 'block');
                $('#status_loader').css('display', 'block');

                loader_timer = setInterval(function () {
                    $('#status_loader').css('display', 'none');
                    main_view.css('display', 'block');
                    $("#status_text").html("Connecté");
                    clearInterval(loader_timer);
                }, 1000);
            });


            $("#test_btn").click(function () {
                $("#test_btn").css('display', 'none');
                $("#stop_btn").css('display', 'block');

                $("#status_text").html("Arrosage");
                $('#status_loader').css('display', 'block');

                loader_timer = setInterval(function () {
                    $("#test_btn").css('display', 'block');
                    $("#stop_btn").css('display', 'none');
                    $('#status_loader').css('display', 'none');
                    $("#status_text").html("Connecté");
                    clearInterval(loader_timer);
                }, 2000);
            });

            $("#stop_btn").click(function () {
                $("#test_btn").css('display', 'block');
                $("#stop_btn").css('display', 'none');

                $("#status_text").html("Connecté");
                $('#status_loader').css('display', 'none');

                clearInterval(loader_timer);
            });

            $("#pump_on_btn").click(function () {
                $('#pump_on_btn').css('display', 'none');
                $('#pump_off_btn').css('display', 'block');
            });

            $("#pump_off_btn").click(function () {
                $('#pump_on_btn').css('display', 'block');
                $('#pump_off_btn').css('display', 'none');
            });

            var test_output_container = document.getElementById("test_output_container");
            var test_output_template = document.getElementById("test_output_template");
            for (let index = 1; index <= 8; index++) {
                var data = { index: index };
                test_output_container.innerHTML += interpolate(test_output_template.innerHTML.toString().trim(), data);

            }
        });
    </script>
</body>

</html>
