<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Système d'arrosage</title>
    <link rel="stylesheet" type="text/css" href="fomantic/semantic.min.css">
    <script src='https://code.jquery.com/jquery-3.1.1.min.js'
        integrity='sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=' crossorigin='anonymous'></script>
    <script src="fomantic/semantic.min.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css">

    <script src="main.js"></script>

    <template id="test_output_template">
        <div class="column">
            <div class="ui test toggle checkbox">
                <input type="checkbox" name="test_output_${index}">
                <label>Sortie ${index}</label>
            </div>
        </div>
    </template>

</head>

<body>
    <div class="ui menu inverted">
        <div class="ui two column grid">
            <div class="four column row">
                <div class="left floated column">
                    <div class="row">
                        <h2>
                            Système d'arrosage
                        </h2>
                        <div class="ui action input">
                            <input id="system_address_input" type="text" placeholder="Adresse du système"
                                value="esp-home.local">
                            <button id="connect_btn" class="ui button">Connexion</button>
                        </div>
                    </div>
                </div>
                <div id="status_bar" class="right floated column">
                    <h3 id="status_text">
                    </h3>
                    <div class="ui inverted segment">
                        <div id="status_loader" class="ui active inverted centered inline loader">
                            <div class="ui large loader"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="main_view" class="ui container">
        <div class="ui top attached tabular menu">
            <a class="item active" data-tab="programming">Programmation</a>
            <a class="item" data-tab="testing">Test</a>
        </div>
        <div class="ui bottom attached tab segment active" data-tab="programming">
            <div class="ui prog two column vertically divided grid">
                <div class="row">
                    <div id="output_select" class="column">
                        <select class="ui search selection dropdown">
                            <option value="0">Sortie 1</option>
                            <option value="1">Sortie 2</option>
                            <option value="2">Sortie 3</option>
                            <option value="3">Sortie 4</option>
                            <option value="4">Sortie 5</option>
                            <option value="5">Sortie 6</option>
                            <option value="6">Sortie 7</option>
                            <option value="7">Sortie 8</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Programme actif</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui toggle checkbox">
                            <input type="checkbox" name="public">
                            <label></label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Date de début</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui calendar" id="standard_calendar">
                            <div class="ui fluid input left icon">
                                <i class="calendar icon"></i>
                                <input type="text" placeholder="Date/Heure">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Durée d'arrosage</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui right labeled input">
                            <input type="number" placeholder="0">
                            <div class="ui dropdown label">
                                <div class="text">Secondes</div>
                                <i class="dropdown icon"></i>
                                <div class="menu">
                                    <div class="item">Secondes</div>
                                    <div class="item">Minutes</div>
                                    <div class="item">Heures</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="six wide column">
                        <p class="vertical-center">Répétition</p>
                    </div>
                    <div class="ten wide column">
                        <div class="ui right labeled input">
                            <input type="number" placeholder="0">
                            <div class="ui dropdown label">
                                <div class="text">Heures</div>
                                <i class="dropdown icon"></i>
                                <div class="menu">
                                    <div class="item">Minutes</div>
                                    <div class="item">Heures</div>
                                    <div class="item">Jours</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ui equal width grid">
                <div class="column">
                    <button id="test_btn" class="ui fullwidth button">Tester</button>
                    <button id="stop_btn" class="ui fullwidth button">Stop</button>
                </div>
                <div class="column">
                    <button id="apply_btn" class="ui fullwidth button">Appliquer</button>
                </div>
            </div>
        </div>
        <div class="ui bottom attached tab segment" data-tab="testing">
            <div id="test_output_container" class="ui two column grid" style="margin: 1rem 0 2rem 0;"></div>
            <button id="pump_on_btn" class="ui fullwidth button">Activer la pompe</button>
            <button id="pump_off_btn" class="ui fullwidth button">Désactiver la pompe</button>
        </div>
    </div>
</body>

</html>
