<!DOCTYPE html>
<html>

<head>
    <!-- Standard Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <!-- Site Properties -->
    <title>Responsive Elements - Semantic</title>
    <link rel="stylesheet" type="text/css" href="fomantic/semantic.min.css">
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"
        integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>
    <script src="fomantic/semantic.min.js"></script>

    <link rel="stylesheet" type="text/css" href="fomantic/components/reset.css">
    <link rel="stylesheet" type="text/css" href="fomantic/components/site.css">

    <link rel="stylesheet" type="text/css" href="fomantic/components/container.css">
    <link rel="stylesheet" type="text/css" href="fomantic/components/menu.css">
    <link rel="stylesheet" type="text/css" href="fomantic/components/input.css">
    <link rel="stylesheet" type="text/css" href="fomantic/components/header.css">
    <link rel="stylesheet" type="text/css" href="fomantic/components/calendar.css">
    <link rel="stylesheet" type="text/css" href="fomantic/components/grid.css">
    <link rel="stylesheet" type="text/css" href="fomantic/components/dropdown.css">

    <style type="text/css">
        body {
            background-color: #FFFFFF;
        }

        .ui.menu .item img.logo {
            margin-right: 1.5em;
        }

        .ui.menu.fixed {
            padding: 1em 0 1em 0;
        }

        .main.container {
            margin-top: 7em;
        }

        .wireframe {
            margin-top: 2em;
        }

        .ui.footer.segment {
            margin: 5em 0em 0em;
            padding: 5em 0em;
        }
    </style>

</head>

<body>

    <div class="ui fixed inverted menu">
        <div class="ui container">
            <a href="#" class="header item">
                Système d'arrosage
            </a>
            <div class="ui action input">
                <input id="system_address_input" type="text" placeholder="Adresse du système" value="esp-home.local">
                <button id="connect_button" class="ui button">Connexion</button>
            </div>
        </div>
    </div>

    <div class="ui container">
        <h1 class="ui header">Semantic UI Fixed Template</h1>
        <div>
            <select class="ui selection dropdown" style="min-height: 3em; margin: 2em 0 2em 0;">
                <option value="0">Sortie 1</option>
                <option value="1">Sortie 2</option>
                <option value="2">Sortie 3</option>
                <option value="3">Sortie 4</option>
                <option value="4">Sortie 5</option>
                <option value="5">Sortie 6</option>
                <option value="6">Sortie 7</option>
                <option value="7">Sortie 8</option>
            </select>
        </div>
        <div class="ui two column grid">
            <div class="row">
                <div class="four wide column">Programme actif</div>
                <div class="six wide column">
                    <div class="ui toggle checkbox">
                        <input type="checkbox" name="public">
                        <label></label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="four wide column">Date de début</div>
                <div class="six wide column">
                    <div class="ui calendar" id="standard_calendar">
                        <div class="ui fluid input left icon">
                            <i class="calendar icon"></i>
                            <input type="text" placeholder="Date/Time">
                        </div>
                    </div>
                </div>
            </div>
            <div class="row" style="height: 4em;">
                <div class="four wide column">Durée d'arrosage</div>
                <div class="six wide column">
                    <div class="ui two column grid">
                        <div class="column">
                            <input style="width: 80%; height: 100%;" type="number">
                        </div>
                        <div class="column">
                            <select class="ui selection dropdown" style="height: 100%; max-width: 50%;">
                                <option value="0">Secondes</option>
                                <option value="1">Minutes</option>
                                <option value="2">Heures</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row" style="height: 4em;">
                <div class="four wide column">Répétition</div>
                <div class="six wide column">
                    <div class="ui two column grid">
                        <div class="column">
                            <input style="width: 80%; height: 100%;" type="number">
                        </div>
                        <div class="column">
                            <select class="ui selection dropdown" style="height: 100%;">
                                <option value="0">Minutes</option>
                                <option value="1">Heures</option>
                                <option value="2">Jours</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row" style="margin: 2em 0 2em 0;">
                <div>
                    <button class="ui button">Tester</button>
                </div>
                <div>
                    <button class="ui button">Appliquer</button>
                </div>
                <div>
                    <button class="ui button">Réinitialiser</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#standard_calendar').calendar({
                firstDayOfWeek: 1
            });

            $("#connect_button").click(function () {
                const address = $("#system_address_input").val();
                const url = "http://" + address + "/api/v1/schedule/read";
                $.getJSON(url, data => {
                    console.log(data);
                });
            });
        });
    </script>
</body>

</html>
