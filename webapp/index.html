<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1">


    <title>Syst&#xE8;me d&apos;arrosage</title>

    <link rel="stylesheet" media="(prefers-color-scheme:light)" href="deps/shoelace-2.20.1/themes/light.css" />
    <link rel="stylesheet" media="(prefers-color-scheme:dark)" href="deps/shoelace-2.20.1/themes/dark.css"
        onload="document.documentElement.classList.add('sl-theme-dark');" />
    <script type="module" src="deps/shoelace-2.20.1/shoelace.js"></script>

    <link rel="stylesheet" href="deps/bulma-1.0.4/css/versions/bulma-prefixed.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            opacity: 0;
        }

        body.ready {
            opacity: 1;
            transition: 0.25s opacity;
        }
    </style>

    <template id="device_list_entry_template">
        <sl-card class="card-header">
            <div slot="header">
                <h3 class="device-entry-header" id="device_list_name_${index}">${name}</h3>
                <sl-icon name="droplet-half"></sl-icon>
            </div>

            <sl-button variant="primary" class="connect-button">Connexion</sl-button>
            <div class="device-entry-description" id="device_list_id_${index}">${id}</div>

        </sl-card>

        <!-- <div class="device-entry-item">
            <sl-icon name="droplet-half"></sl-icon>
            <div class="device-entry-content">
                <a class="device-entry-header" id="device_list_name_${index}" href="#">${name}</a>
                <div class="device-entry-description" id="device_list_id_${index}">${id}</div>
            </div>
        </div> -->
    </template>

</head>

<body>

    <div class="progress_container">
        <sl-progress-ring id="progress_ring" class="progress" value="0"></sl-progress-ring>
        <sl-spinner id="progress_spinner" class="progress"></sl-spinner>
    </div>

    <sl-tab-group id="tabs">
        <sl-tab slot="nav" panel="connect">Connexion</sl-tab>
        <sl-tab slot="nav" panel="program">Programmation</sl-tab>
        <sl-tab slot="nav" panel="test">Test</sl-tab>


        <sl-tab-panel name="connect">
            <sl-button id="search_button" variant="primary" size="large">Rechercher</sl-button>
            <sl-divider></sl-divider>
            <div id="device_list" class="device-list">
            </div>
        </sl-tab-panel>

        <sl-tab-panel name="program">
            This is the program tab panel.
        </sl-tab-panel>

        <sl-tab-panel name="test">
            This is the test tab panel.
        </sl-tab-panel>

    </sl-tab-group>

    <!-- <sl-checkbox>Check me</sl-checkbox>
    <br />
    <sl-input type="datetime-local"></sl-input>
    <br />
    <sl-input type="number"></sl-input>
    <br />
    <sl-relative-time date="2025-08-03T23:17:00-04:00"></sl-relative-time> -->


    <!-- <script type="text/javascript" src="cordova.js"></script> -->
    <script>var exports = {};</script>
    <script type="text/javascript" src="dist/lib.js"></script>
    <script type="module">
        testFromTS();
    </script>


    <script type="module">
        // Make sure all Shoelace custom elements are loaded before
        // showing the page content to avoid flashes and shifts
        await Promise.allSettled([
            customElements.whenDefined('sl-button'),
            customElements.whenDefined('sl-checkbox'),
        ]);

        // Button, card, and rating are registered now! Add
        // the `ready` class so the UI fades in.
        document.body.classList.add('ready');
    </script>

</body>

</html>
